rules:
  directory_hierarchy: Excel A列为一级专题，B列为二级目录，C列为三级目录，D列为四级目录
  large_question_directory_is_level2: true
  numbered_level2_is_not_topic: true
  topic_order_first: early_topics_only
  large_question_core_topic_start_order: 10
  large_question_core_topic_start_title: 三角形
  page_scope_is_hint_only: true
  actual_question_over_site_tags: true
  question_text_is_primary: true
  answer_is_auxiliary: true
  ignore_unrelated_answer_material: true
  latest_prerequisite_definition: 仅适用于专题10之前的基础或前置知识专题；完整解答该题不可缺少、且在目录顺序中最靠后的知识专题
  compound_question_unit: 同一题的多个小问必须整体归属，不得按小问拆分到不同专题或目录
  compound_question_routing: 先以承担整题主结论、核心难点或最困难非例行推理的知识点归属；仅在候选核心无法区分轻重时，才以完整必备知识中的最晚前置知识归属
  large_question_core_topic_definition: 从专题10“三角形”起及后续专题的【大题】默认面向已学完全部知识点的初三学生，按最终解决问题的核心突破口、决定性性质或证明链主线归类
  level3_axis: primary_object_or_context
  level4_axis: main_question_or_decisive_condition
  remove_story_background: true
  require_unique_target: true
  require_pairwise_level3_exclusivity: true
  require_leaf_target_unique_match: true
  require_level4_unique_match_when_available: true
  classification_basis_requires_pairwise_decidable_boundaries: true
  classification_evidence_is_audit_only: true
  parent_knowledge_point_protection: true
  proposal_minimum_distinct_questions: 3
  proposal_single_question_action: observe
  proposal_two_question_action: observe_unless_existing_long_term_evidence

decision_protocol:
  - 检查题干、公式和答案信息是否足够；不足时必须复核，不得猜测。
  - 以实际题干为分类主依据，答案只作补充验证；答案包含题干未出现的独立小题或数学对象时，忽略无关答案段落，不得让其改变题干可唯一确定的分类。
  - 忽略网页当前目录的强制约束，只把它作为弱提示。
  - 列出完整解题不可缺少的全部知识点，不得只看题目所在网页或已有标签。
  - 先按通行的中学数学运算优先级解释题干和答案：乘方优先于一元正负号，未用括号包住的正负号不自动并入幂底。可由标准规则唯一确定的表达式不得仅因未额外加括号而视为歧义；只有多个解释都符合题干且不能由答案或上下文排除时才可暂停分类。排版控制符夹在同一数字或标识符中时先清理为同一文本单元，其余未知控制符保留为输入风险。
  - 同一题含多个跨知识点小问时，必须作为整题归属，不能按小问拆分。先比较各知识点对整题主结论、核心难点和最困难非例行推理的作用；存在明确核心时归入该知识点。仅在候选核心无法区分轻重时，才以完整必备知识中的最晚前置知识归属；更晚的常规计算、铺垫或辅助代入不得压过明确核心。
  - 再判定分类阶段：专题10之前的非复合题或上述核心并列题，按目录顺序选择最晚必备知识点所属专题；从专题10“三角形”起及后续专题的【大题】，按最终解决问题的核心突破口、决定性性质或证明链主线选择专题。后者不得因扇形面积、旋转、坐标或代数运算等辅助步骤而改变专题归属。
  - 在选定专题内，以首要数学对象或情境确定三级目录。
  - 四级目录必须逐项读取分类依据（classification_basis / Excel N列），不得只从目录标题推断边界。以题目的主问或决定性条件直接满足、且能排除其他同级候选的那一条依据确定末级目录；分类依据未填写只表示没有额外文字边界，仍须结合目录名称、层级和题目信息继续分类，不得因此直接复核；无法形成唯一匹配时才复核。
  - 目录分类依据必须是可与同级目录两两区分的语义边界；题号、样题 ID、历史统计等只可保留为审计证据，不得作为模型判断目录归属的输入。批量分类中每个结果仍须依据对应题目的内容和目录语义独立形成；不得把同批其他题的题号、结果或顺序作为归属依据。
  - 对专题10及后续专题的【大题】，用反事实检查区分核心与辅助：去掉候选知识点后主结论的证明或求解主线仍成立时，它只是辅助步骤；主线失效，或该知识点就是最终主问/决定性条件时，才是核心考点。以主问或决定性条件确定四级目录；常规步骤、故事背景和否定性宽泛描述不得压过关键知识特征。
  - 对所有同级候选做两两排他检查；无法唯一命中时必须复核。若三级目录没有四级子目录，则三级即为末级；仅对实际存在四级子目录的三级目录执行四级唯一命中检查。
  - 新目录只可作为候选，单道题不得创建新目录。

mandatory_review_when:
  - target_topic_is_later_than_current_topic
  - no_unique_target
  - target_directory_does_not_exist
  - parent_level3_has_knowledge_point_id
  - requires_new_directory
  - text_or_image_evidence_conflicts
