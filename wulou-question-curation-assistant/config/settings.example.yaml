  #     - id: gpt
  #       name: GPT
  #       protocol: responses  # 可选：responses、chat_completions、anthropic_messages
  #       model: 请填写支持 Responses 和结构化输出的目录分类模型名
  #       routing_model: 可选；留空则与目录分类模型相同
  #       reasoning_effort: high
  #       routing_reasoning_effort: medium
