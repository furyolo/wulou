host: 127.0.0.1
port: 3232

taxonomy_path: taxonomy.example.yaml
rules_path: classification-rules.yaml
cache_path: ../.local-data/classification.sqlite3

# 启动时在同一命名前缀内按“日期 + vN”发现最新工作簿，并原子更新本地 taxonomy 快照。
# 自动同步只读工作簿；生成的新版本永不覆盖此文件。
# directory_workbook:
#   path: ../../local-materials/中考数学分类汇编/★全国中考数学-导出目录,ID-<ID>-<日期> v<N>.xlsx
#   sheet: 目录
#   auto_sync: true

# 规则分类器默认保守复核。模型方案可自由切换；处理速度由全部方案共用。
classifier:
  mode: heuristic
  auto_accept_min_confidence: 0.92
  # 要启用云端分类时，将 mode 改为 cloud_hybrid，并至少配置一个模型方案。
  # pipeline:  # 所有模型方案共享的处理速度与任务编排设置。
  #   max_concurrent_requests: 3
  #   timeout_seconds: 600
